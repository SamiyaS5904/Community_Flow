<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Archetype - List</title>
<link rel="stylesheet" href="styles.css">
<style>html,body{ width:1080px; height:1350px; }</style>
</head>
<body class="{{THEME_CLASS}}">

<div class="page">

  <header class="header">
    <div class="brand">
      <img class="brand-logo" src="{{LOGO}}" alt="">
      <div class="brand-text">
        <span class="brand-name">{{BRAND_NAME}}</span>
        <span class="brand-sub">{{BRAND_SUB}}</span>
      </div>
    </div>
    <span class="pill category-pill">{{CATEGORY}}</span>
  </header>
  <hr class="divider header-divider">


  <section class="hero">
    <span class="eyebrow">{{HOOK}}</span>
    <h1 class="title">{{TITLE}}</h1>
    <p class="subtitle">{{SUBTITLE}}</p>
  </section>

  <section class="content">
    {{ITEMS_HTML}}
  </section>

  <footer class="footer">
    <hr class="divider footer-divider">
    <div class="footer-inner">
      <div class="footer-left">
        <span class="footer-website">{{WEBSITE}}</span>
        <span class="footer-source">{{SOURCE}}</span>
      </div>
      <div class="footer-right">
        <span class="cta-pill">{{CTA}}</span>
        <span class="page-number">{{PAGE}}</span>
      </div>
    </div>
  </footer>


</div>

</body>
</html>
